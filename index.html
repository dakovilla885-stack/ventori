<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENTORI OFFICIAL DROP</title>
    <style>
        body { margin: 0; background-color: #000000; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: center; overflow-x: hidden; }
        #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.6s ease-in-out; }
        .splash-logo { max-width: 400px; width: 90%; height: auto; animation: logoIntro 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes logoIntro { 0% { transform: scale(0.3) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        #main-content { display: none; opacity: 0; transition: opacity 0.6s ease-in-out; padding: 20px 15px; }
        header { padding: 20px 0; border-bottom: 1px solid #111; margin-bottom: 30px; }
        .nav-logo { max-width: 200px; height: auto; }
        .products-grid { display: grid; grid-template-columns: 1fr; gap: 40px; max-width: 450px; margin: 0 auto; }
        .product-card { text-align: left; }
        .product-image { width: 100%; aspect-ratio: 1 / 1; background-color: #111; object-fit: cover; }
        .product-info { margin-top: 15px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; letter-spacing: 0.5px; }
        .product-price { color: #888; }
        .buy-button { display: block; width: 100%; background-color: #ffffff; color: #000000; border: none; padding: 16px 0; font-size: 13px; font-weight: 900; letter-spacing: 1px; margin-top: 15px; cursor: pointer; text-decoration: none; text-align: center; }
    </style>
</head>
<body>
    <div id="splash-screen">
        <img class="splash-logo" src="https://postimg.cc" alt="Ventori Logo">
    </div>
    <div id="main-content">
        <header>
            <img class="nav-logo" src="https://postimg.cc" alt="Ventori Logo">
        </header>
        <div class="products-grid">
            <div class="product-card">
                <img class="product-image" src="https://unsplash.com" alt="Product">
                <div class="product-info">
                    <span>VENTORI ZIP-HOODIE "BLACK"</span>
                    <span class="product-price">1600 UAH</span>
                </div>
                <a href="https://instagram.com" class="buy-button">ORDER VIA INSTAGRAM</a>
            </div>
        </div>
    </div>
    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const content = document.getElementById('main-content');
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; content.style.display = 'block'; setTimeout(() => { content.style.opacity = '1'; }, 50); }, 600);
        }, 1500);
    </script>
</body>
</html>
