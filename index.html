<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENTORI OFFICIAL DROP</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            text-align: center;
            overflow-x: hidden;
        }

        /* 1. АНІМАЦІЯ ЛОГОТИПУ ПРИ ВХОДІ (СПЛЕШ-СКРІН) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease-in-out;
        }

        /* Ефект крутіння твого логотипу Ventori */
        .splash-logo {
            max-width: 400px; 
            width: 90%;
            height: auto;
            animation: logoIntro 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes logoIntro {
            0% { transform: scale(0.3) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 2. ГОЛОВНИЙ КАТАЛОГ */
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            padding: 20px 15px;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid #111;
            margin-bottom: 30px;
        }
        .nav-logo {
            max-width: 200px; 
            height: auto;
        }

        /* 3. КАРТКИ ТОВАРІВ */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            max-width: 450px;
            margin: 0 auto;
        }
        .product-card {
            text-align: left;
        }
        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #111;
            object-fit: cover;
        }
        .product-info {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .product-price {
            color: #888;
        }

        /* КНОПКА ЗАМОВЛЕННЯ */
        .buy-button {
            display: block;
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 0;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Екран завантаження (Твоє лого Ventori красиво крутиться) -->
    <div id="splash-screen">
        <img class="splash-logo" src="https://githubusercontent.com">
    </div>

    <!-- Сам каталог товарів -->
    <div id="main-content">
        <header>
            <img class="nav-logo" src="https://githubusercontent.com">
        </header>

        <div class="products-grid">
            <div class="product-card">
                <!-- ФОТО ТВОГО ХУДІ З ImgBB -->
                <img class="product-image" src="https://ibb.co">
                <div class="product-info">
                    <span>VENTORI ZIP-HOODIE "BLACK"</span>
                    <span class="product-price">1600 UAH</span>
                </div>
                <!-- ЛІНК НА ТВІЙ ІНСТАГРАМ -->
                <a href="https://instagram.com" class="buy-button">ORDER VIA INSTAGRAM</a>
            </div>
        </div>
    </div>

    <script>
        // Анімація триває 1.5 секунди, потім плавно відкривається товар
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const content = document.getElementById('main-content');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                content.style.display = 'block';
                setTimeout(() => { content.style.opacity = '1'; }, 50);
            }, 600);
        }, 1500);
    </script>

</body>
</html>
